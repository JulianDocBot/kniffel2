<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Kniffel • Mobile Scoreboard</title>

<style>
:root{
  --bg:#f8f8f8;--card:#fff;--txt:#111;--accent:#0a84ff;--warn:#e53935;--brd:#ccccd0;
  --rad:10px;--gap:.7rem;--sh:0 1px 4px rgba(0,0,0,.08);font-size:16px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1e;--card:#2c2c2e;--txt:#f2f2f7;--brd:#3a3a3c;--sh:0 1px 6px rgba(0,0,0,.6);}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
     background:var(--bg);color:var(--txt);
     padding:env(safe-area-inset-top) .75rem env(safe-area-inset-bottom);}

/* ---------- Setup ---------- */
#setup{max-width:340px;margin:5rem auto 0;text-align:center;display:flex;flex-direction:column;gap:var(--gap);}
#setup h2{font-size:1.35rem;}
select,button{font-size:1rem;padding:.65rem .9rem;border-radius:var(--rad);border:1px solid var(--brd);}
button{background:var(--accent);color:#fff;border:none;font-weight:600;cursor:pointer;box-shadow:var(--sh);}
button:active{transform:scale(.97);}

/* ---------- Scoreboard ---------- */
#score-area{display:none;margin-top:var(--gap);}
#controls{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:var(--gap);}
#controls button{background:none;border:1px solid var(--brd);border-radius:var(--rad);padding:.45rem .7rem;
                 color:var(--accent);font-weight:600;font-size:.9rem;flex:1 1 170px;}

.wrapper{overflow-x:auto;border:1px solid var(--brd);border-radius:var(--rad);background:var(--card);box-shadow:var(--sh);}
table{border-collapse:collapse;min-width:520px;width:100%;}
th,td{border-bottom:1px solid var(--brd);text-align:center;padding:.45rem .4rem;}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;z-index:1;}
th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:700;}

select{width:100%;padding:.35rem;border-radius:var(--rad);border:1px solid var(--brd);font-size:1rem;background:var(--card);}
input[type=text]{width:100%;font-weight:600;border:none;background:transparent;text-align:center;font-size:1rem;}

.switch{position:relative;display:inline-block;width:46px;height:26px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#d1d1d6;border-radius:26px;transition:.3s;}
.slider:before{content:"";position:absolute;height:22px;width:22px;left:2px;top:2px;background:#fff;
               border-radius:50%;transition:.3s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(20px);}

.output{font-weight:600;font-size:1.05rem;}
.need-bonus{color:var(--warn);}
</style>
</head>

<body>
<!-- ---------- 1) Start-Seite ---------- -->
<div id="setup">
  <h2>Wie viele Spieler?</h2>
  <select id="player-select">
    <option value="1">1 Spieler</option>
    <option value="2" selected>2 Spieler</option>
    <option value="3">3 Spieler</option>
    <option value="4">4 Spieler</option>
  </select>
  <button id="start-btn">Start</button>
</div>

<!-- ---------- 2) Scoreboard ---------- -->
<div id="score-area">
  <div id="controls">
    <button id="reset-all">Neu starten</button>
    <button id="reset-scores">Neu starten (Spieler lassen)</button>
  </div>
  <div class="wrapper"><table id="score-table"></table></div>
</div>

<script>
/* ---------- Daten ---------- */
const UPPER = [
  {k:"1er",o:[0,1,2,3,4,5]},
  {k:"2er",o:[0,2,4,6,8,10]},
  {k:"3er",o:[0,3,6,9,12,15]},
  {k:"4er",o:[0,4,8,12,16,20]},
  {k:"5er",o:[0,5,10,15,20,25]},
  {k:"6er",o:[0,6,12,18,24,30]}
];
const LOWER_SELECT = [
  {k:"dreierpasch",l:"Dreierpasch"},
  {k:"viererpasch",l:"Viererpasch"},
  {k:"chance",     l:"Chance"}
];
const SWITCHES = [
  {k:"fullhouse", l:"Full House",v:25},
  {k:"kleinestr", l:"Kl. Straße",v:30},
  {k:"grossestr", l:"Gr. Straße",v:40},
  {k:"kniffel",   l:"Kniffel",   v:50}
];
const OUT = {
  sumOben : {l:"Gesamt Oben"},
  bonus   : {l:"Bonus"},
  obenGes : {l:"Oben + Bonus"},
  sumUnten: {l:"Gesamt Unten"},
  endSum  : {l:"Endsumme"}
};

const LIMIT=63,BONUS=35,STORE="kniffelTable";
let PLAYERS=0;

/* ---------- Helper ---------- */
const $ = q => document.querySelector(q);
const $$ = q => document.querySelectorAll(q);
function el(tag,attr={},...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attr)){
    if(k==="class") n.className=v;
    else if(k in n) n[k]=v;
    else n.setAttribute(k,v);
  }
  kids.forEach(c=>n.append(c));
  return n;
}

/* ---------- Setup ---------- */
$("#start-btn").onclick=()=>go(+$("#player-select").value);
const old=load(); if(old) go(old.players,true,old.data);

/* ---------- Tabelle aufbauen ---------- */
function go(n,restore=false,data=null){
  PLAYERS=n;
  $("#setup").style.display="none";
  build();
  $("#score-area").style.display="block";
  if(restore) apply(data);
  calc();
  save();
}
function build(){
  const t=$("#score-table"); t.innerHTML="";
  const head=el("tr",{},el("th",{},"Kategorie"));
  for(let i=1;i<=PLAYERS;i++){
    head.append(el("th",{},el("input",{type:"text",id:`p${i}-name`,value:`Spieler ${i}`,"data-save":"1"})));
  }
  t.append(head);

  const addRow=(label,cb)=>{const r=el("tr",{});r.append(el("td",{},label));cb(r);t.append(r);};
  UPPER.forEach(c=>addRow(c.k,r=>{
    for(let i=1;i<=PLAYERS;i++){
      const s=el("select",{id:`p${i}-${c.k}`,"data-save":"1"});c.o.forEach(v=>s.add(new Option(v,v)));
      r.append(el("td",{},s));
    }
  }));
  addOut(OUT.sumOben.l,"sumOben");
  addOut(OUT.bonus.l,"bonus");
  addOut(OUT.obenGes.l,"obenGes");

  LOWER_SELECT.forEach(c=>addRow(c.l,r=>{
    for(let i=1;i<=PLAYERS;i++){
      const s=el("select",{id:`p${i}-${c.k}`,"data-save":"1"});
      [...Array(31).keys()].forEach(v=>s.add(new Option(v,v))); r.append(el("td",{},s));
    }
  }));
  SWITCHES.forEach(c=>addRow(c.l,r=>{
    for(let i=1;i<=PLAYERS;i++){
      const chk=el("input",{type:"checkbox",id:`p${i}-${c.k}`,value:c.v,"data-save":"1"});
      r.append(el("td",{},el("label",{class:"switch"},chk,el("span",{class:"slider"}))));
    }
  }));

  addOut(OUT.sumUnten.l,"sumUnten");
  addOut(OUT.endSum.l,"endSum");

  function addOut(label,key){addRow(label,r=>{
    for(let i=1;i<=PLAYERS;i++) r.append(el("td",{},el("span",{id:`p${i}-${key}`,class:"output"},"0")));
  });}

  /* Listener */
  $("#score-table").addEventListener("change",e=>{
    if(e.target.matches("select, input[type=checkbox], input[type=text]")){ calc(); save(); }
  });
}

/* ---------- Rechnen ---------- */
function calc(){
  for(let p=1;p<=PLAYERS;p++){
    let up=0, low=0;
    UPPER.forEach(c=>up+= +$("#p"+p+"-"+c.k).value||0);
    LOWER_SELECT.forEach(c=>low+= +$("#p"+p+"-"+c.k).value||0);
    SWITCHES.forEach(c=>$("#p"+p+"-"+c.k).checked && (low+=+c.v));

    const diff=LIMIT-up, bonus=diff<=0?BONUS:0;
    set(p,"sumOben",up);
    const bonusCell=$("#p"+p+"-bonus");
    if(diff>0){ bonusCell.textContent=diff; bonusCell.classList.add("need-bonus"); }
    else      { bonusCell.textContent=bonus; bonusCell.classList.remove("need-bonus"); }
    set(p,"obenGes",up+bonus);
    set(p,"sumUnten",low);
    set(p,"endSum",up+bonus+low);
  }
  function set(p,k,v){$("#p"+p+"-"+k).textContent=v;}
}

/* ---------- Speicher ---------- */
function save(){
  const o={players:PLAYERS,data:{}};
  $$("[data-save]").forEach(el=>{
    o.data[el.id]=el.type==="checkbox"?el.checked:el.value;
  });
  localStorage.setItem(STORE,JSON.stringify(o));
}
function load(){try{const d=JSON.parse(localStorage.getItem(STORE));return d&&d.players?d:null;}catch{return null;}}
function apply(obj){for(const [id,v] of Object.entries(obj)){const el=$("#"+id); if(!el)continue;
  el.type==="checkbox"?el.checked=v:el.value=v;}}
/* ---------- Reset 1: komplett ---------- */
$("#reset-all").onclick=()=>{
  if(confirm("Alles löschen und Spieler neu wählen?")){
    localStorage.removeItem(STORE);
    location.reload();       // landet automatisch wieder im Setup
  }
};
/* ---------- Reset 2: Punkte löschen ---------- */
$("#reset-scores").onclick=()=>{
  if(!confirm("Alle Ergebnisse löschen, Spieler behalten?")) return;

  /* selects → 0 | checkboxes → false */
  $$("[data-save]").forEach(el=>{
    if(el.type==="checkbox" && el.id.includes("-name")===false){ el.checked=false; }
    else if(el.tagName==="SELECT") { el.selectedIndex=0; }
    /* Namen (input text) werden absichtlich ignoriert */
  });
  calc(); save();
};

/* Warnung vorm Verlassen */
window.addEventListener("beforeunload",e=>{
  e.preventDefault(); e.returnValue="Nicht gespeicherte Daten gehen verloren – Seite wirklich verlassen?";
});
</script>
</body>
</html>
